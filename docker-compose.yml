# Full stack:   docker compose up --build        -> app on http://localhost:8080
# Mongo only:   docker compose up -d mongo       -> for running backend/frontend locally
#
# Optional overrides (shell env or a root .env file):
#   WEB_PORT=8081   MONGO_PORT=27018   JWT_SECRET=...   ADMIN_EMAIL=...   ADMIN_PASSWORD=...
#
# The API is NOT published on the host: the browser talks to nginx (WEB_PORT), which forwards
# /api to the backend over the compose network. (macOS also reserves host port 5000 for AirPlay.)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/multi_vendor_marketplace
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:${WEB_PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
