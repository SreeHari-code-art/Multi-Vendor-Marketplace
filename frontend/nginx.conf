server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving at request time (not at startup) means nginx still starts
  # if the API container isn't ready yet, and keeps working if the backend restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://backend:5000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback so deep links like /products/123 work on refresh
  location / {
    try_files $uri /index.html;
  }
}
